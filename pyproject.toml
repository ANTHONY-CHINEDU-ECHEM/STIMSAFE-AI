[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stimsafe"
version = "1.0.0"
description = "Safety constrained recommendation of ovarian stimulation protocols"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "matplotlib>=3.8", "pyyaml>=6.0", "joblib>=1.3",
    "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 170

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E702"]
